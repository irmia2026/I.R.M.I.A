name: Backend compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install optional Linux tool dependencies for testing
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep python3-pil fonts-noto-cjk
      - run: npm ci
      - run: npm run build
      - name: Test platform-sensitive backend paths
        run: >-
          node --experimental-strip-types --test --test-concurrency=2
          test/linux-compatibility.test.ts
          test/linux-desktop-media.test.ts
          test/instance-registry.test.ts
          test/server-port-file.test.ts
          test/subagent-screenshot.test.ts
          test/event-log.test.ts
          test/event-log-durability.test.ts
          test/instance-lock.test.ts
          test/instance-guard.test.ts
          test/guardian.test.ts
          test/hooks.test.ts
          test/deps.test.ts
          test/install-check.test.ts
          test/mcp-client.test.ts
          test/plugin-runtime-node.test.ts
          test/plugin-runtime-python.test.ts
          test/plugin-runtime-safety.test.ts
          test/subagent-deps.test.ts
          test/fs-tools.test.ts
          test/media-poster.test.ts
          test/web-server.test.ts
          test/keys.test.ts
          test/webhook-secret.test.ts
          test/onebot.test.ts
          test/install-snowluma.test.ts
          test/protocol-side.test.ts
          test/protocol-observability.test.ts
          test/protocol-fallback.test.ts
      - name: Smoke test the Linux build from an isolated state directory
        if: runner.os == 'Linux'
        run: node scripts/smoke-linux.mjs

  linux-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev libayatana-appindicator3-dev
      - name: Install the verified Flutter SDK
        run: |
          archive="$RUNNER_TEMP/flutter.tar.xz"
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 240 \
            https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.35.4-stable.tar.xz -o "$archive"
          echo "151c75539aa1c01b874954d7b6e0006a622a3f12c76fd7f1fcafad27e6a2d68a  $archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run build
      - name: Test and build the Flutter desktop
        working-directory: gui
        run: |
          flutter pub get
          flutter test test/backend_port_test.dart test/tray_menu_test.dart test/restart_action_test.dart
          flutter build linux --release
      - name: Package both Linux builds
        run: |
          bash scripts/package-linux.sh "$RUNNER_TEMP/irmia-release"
          bash scripts/package-linux.sh "$RUNNER_TEMP/irmia-release" --desktop
          cd "$RUNNER_TEMP/irmia-release"
          sha256sum -c ./*.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: irmia-ubuntu-x86_64
          path: ${{ runner.temp }}/irmia-release/
          if-no-files-found: error
          compression-level: 0
